    <text x="60" y="116" fill="#647b66" font-size="22">A clearer view of daily intake.</text>

    <g fill="#ffffff" stroke="#d8e4d2" stroke-width="2">
      <rect x="60" y="177" width="420" height="84" rx="12"/>
      <rect x="60" y="279" width="420" height="84" rx="12"/>
      <rect x="60" y="381" width="420" height="84" rx="12"/>
