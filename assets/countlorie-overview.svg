<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Countlorie calorie tracker product illustration</title>
  <desc id="desc">An original product illustration representing personalized calorie targets, meal and portion logging, and intake monitoring. The simplified phone drawing is not an actual application screenshot.</desc>
