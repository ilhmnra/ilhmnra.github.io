    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="m0 0 7 3.5L0 7" fill="none" stroke="#799c8c" stroke-width="1.5"/></marker>
  </defs>
