<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Etrained training administration workflow</title>
  <desc id="desc">An original conceptual diagram connecting training requests, approval, training delivery and records. This is a workflow illustration, not a screenshot.</desc>
